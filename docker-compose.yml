services:
  # ── Backend FastAPI ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env # Lê DATABASE_URL, R2_*, API_KEY, etc.
    ports:
      - "5000"
    volumes:
      # Volume para o modelo fine-tunado — persiste entre rebuilds e deployments
      - ./models:/app/models
    restart: unless-stopped

  # ── Frontend Next.js ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Lidos em runtime pelo Route Handler (proxy server-side)
      API_URL: http://backend:5000
      API_KEY: ${API_KEY}
    ports:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
